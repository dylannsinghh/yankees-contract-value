models:
  - name: int_player_seasons
    columns:
      - name: player_season_key
        data_tests:
          - unique
          - not_null
      - name: primary_role
        data_tests:
          - accepted_values:
              arguments:
                values: ['hitter', 'pitcher']

  - name: int_contract_seasons
    columns:
      - name: contract_season_key
        data_tests:
          - unique
          - not_null
      - name: nyy_share
        data_tests:
          - not_null

  - name: int_marcel_projections
    columns:
      - name: projection_key
        data_tests:
          - unique
          - not_null
      - name: projected_war
        data_tests:
          - not_null
      - name: reliability
        data_tests:
          - not_null

  - name: int_remaining_contract_seasons
    columns:
      - name: remaining_season_key
        data_tests:
          - unique
          - not_null
      - name: expected_war
        data_tests:
          - not_null
      - name: healthy_war
        data_tests:
          - not_null