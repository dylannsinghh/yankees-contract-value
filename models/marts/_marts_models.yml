models:
  - name: mart_2026_snapshot
    columns:
      - name: player_id
        data_tests:
          - unique
          - not_null
      - name: role
        data_tests:
          - accepted_values:
              arguments:
                values: ['hitter', 'starter', 'reliever']
      - name: cost_2026_usd
        data_tests:
          - not_null:
              config:
                where: "played_for_nyy"
      - name: excluded_reason
        data_tests:
          - not_null:
              config:
                where: "not played_for_nyy"

  - name: mart_contract_retrospective
    columns:
      - name: player_id
        data_tests:
          - unique
          - not_null
      - name: cost_to_date_usd
        data_tests:
          - not_null

  - name: mart_remaining_value
    columns:
      - name: player_id
        data_tests:
          - unique
          - not_null
      - name: remaining_cost_usd
        data_tests:
          - not_null

  - name: mart_roster_value
    columns:
      - name: player_id
        data_tests:
          - unique
          - not_null

  - name: mart_2027_outlook
    columns:
      - name: sort_order
        data_tests:
          - unique
          - not_null
      - name: value
        data_tests:
          - not_null

  - name: mart_pending_free_agents
    columns:
      - name: player_id
        data_tests:
          - unique
          - not_null
      - name: profile
        data_tests:
          - not_null